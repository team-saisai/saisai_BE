name: Auto Merge

on:
  workflow_run: # 다른 워크플로우가 실행 완료될 때 트리거
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: | # CI 성공시 & PR과 연관된 워크플로우 시 
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null

    steps:
      # PR 번호 추출
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = ${{ toJson(github.event.workflow_run.pull_requests) }};
            const prNumber = pullRequests[0].number;
            core.setOutput('pr_number', prNumber);

      # auto-merge 라벨 체크
      - name: Check for auto-merge label
        id: check-label
        run: |
          labels=$(gh pr view ${{ steps.pr.outputs.pr_number }} --json labels --jq '.labels[].name')
          if echo "$labels" | grep -q "🌀 auto-merge"; then
            echo "has_label=true" >> $GITHUB_OUTPUT
          else
            echo "has_label=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 자동 merge 실행
      - name: Auto merge PR
        if: steps.check-label.outputs.has_label == 'true'
        run: gh pr merge --squash ${{ steps.pr.outputs.pr_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
