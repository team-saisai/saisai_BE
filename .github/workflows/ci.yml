# 워크 플로우 이름
name: CI

on:
  pull_request:
    types: [ opened, synchronize ]
    branches: [ dev, main ]
    paths: # 이 경로가 변경되었을 떄만 트리거 발동
      - 'src/**'
      - '.github/**'


permissions:
  contents: read # 코드와 파일 읽을 수 있도록 허용(기본값)
  pull-requests: write # PR 댓글을 위해 쓰기 허용

jobs:
  # PR 열릴 때 CI 실행
  test_and_build:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')
    runs-on: ubuntu-latest
    environment: test # 테스트 환경을 명시

    steps:
      # 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gredlew 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # gradle 빌드 (캐싱을 통해 빌드 시간 단축)
      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v3
        with:
          # 캐시 처리 (main, dev 브랜치 제외)
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
          add-job-summary-as-pr-comment: always
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      # 테스트 코드 실행. 이후 환경변수 설정이 필요하면 추가 필요
      - name: Run Tests
        run: ./gradlew test --info || true # 테스트 코드가 없어도 워크플로우가 실패하지 않도록 `|| true` 추가

      # JAR 파일 빌드 검증
      - name: Build Application
        run: ./gradlew bootJar -x test