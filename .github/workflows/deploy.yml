
# 워크 플로우 이름
name: Deploy to Development

# 어떤 브랜치에서 어떤 행동이 일어날 때 cicd가 일어날 것인지를 설정
on:
  push:
    branches: [ dev, main ]
    paths: # 이 경로가 변경되었을 떄만 트리거 발동
      - 'src/**'
      - '.github/**'
      - 'Dockerfile'
      - 'build.gradle'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # dev 브랜치로 병합될 때 CD
  deploy_to_dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v3

      # JDK 17로 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradlew 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 캐싱
      - name: Setup Gradle with Caching for CD
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false  # CD에서는 캐시 쓰기 허용
          add-job-summary-as-pr-comment: false  # CD에서는 PR 댓글 불필요
          build-scan-publish: false  # CD에서는 빌드 스캔 불필요

      - name: Build Application
        run: ./gradlew bootJar -x test # 테스트는 CI에서 했으므로 빌드만

      # AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Amazon ECR 로그인
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

       # 이미지 빌드 및 ECR push
      - name: Build and Push to ECR
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile이 있는 현재 디렉토리를 빌드 컨텍스트로 사용
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:sai-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max # 도커 빌드 캐시 적용

      # 애플리케이션 배포
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.HOST }}
            username: ${{ secrets.USER }}
            key: ${{ secrets.SSH_KEY }}
            port: ${{ secrets.SSH_PORT }}
            script: |
              echo "ECR 레지스트리 로그인 중..."
              aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
    
              # 배포 변수 설정
              DOCKER_IMAGE_NAME=${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}
              IMAGE_TAG=sai-${{ github.sha }}
              CONTAINER_NAME=saisai-server
              HOST_PORT=${{ secrets.HOST_PORT }}
    
              # 기존 컨테이너 정리
              echo "기존 컨테이너 정리 중..."
              sudo docker stop $CONTAINER_NAME 2>/dev/null || true
              sudo docker rm $CONTAINER_NAME 2>/dev/null || true
    
              # 최신 이미지 다운로드
              echo "최신 이미지 다운로드 중..."
              sudo docker pull $DOCKER_IMAGE_NAME:$IMAGE_TAG
    
              # 컨테이너 실행
              echo "새로운 컨테이너 실행 중..."
              sudo docker run -d \
                --name $CONTAINER_NAME \
                -p 8080:8080 \
                --restart unless-stopped \
                --env-file $HOME/.env \
                --log-opt max-size=10m \
                --log-opt max-file=5 \
                $DOCKER_IMAGE_NAME:$IMAGE_TAG
    
              echo "🎉 배포 완료"

      # 헬스체크
      - name: Health Check
        run: |
          CONTAINER_NAME=saisai-server
          HOST_PORT=${{ secrets.HOST_PORT }}

          # 애플리케이션 헬스체크
          for i in {1..120}; do
            health_check=$(curl -sf https://localhost:$HOST_PORT/actuator/health || echo "")
            api_docs=$(curl -sf https://localhost:$HOST_PORT/v3/api-docs || echo "")

            if [[ "$health_check" == *"UP"* ]] || [[ "$api_docs" == *"openapi"* ]]; then
              echo "🎉 애플리케이션 정상 실행 확인!"
              exit 0
            else
              echo "대기 중... ($i/120)"
              sleep 3
            fi
          done
            echo "😡 서버 애플리케이션 실행 실패..."
            exit 1
          echo "📄 컨테이너 로그:"
          sudo docker logs $CONTAINER_NAME --tail 50
          exit 1